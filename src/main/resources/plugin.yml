name: GridStorage
version: 1.0.2
main: com.gridstorage.GridStorage
api-version: '1.20'
authors: [chenasyd]
description: Personal multi-page grid storage for Spigot/Paper/Folia 1.20+
website: https://github.com/chenasyd
softdepend: [NBTAPI]
load: POSTWORLD
folia-supported: true

commands:
  gridstorage:
    description: Open personal grid storage
    usage: /gridstorage help
    aliases: [gs]
    permission: gridstorage.use
  gridstorageadmin:
    description: Grid storage admin commands
    usage: /gridstorageadmin help
    aliases: [gsa]
    permission: gridstorage.admin

permissions:
  gridstorage.use:
    description: Allow using personal grid storage
    default: true
  gridstorage.admin:
    description: Grid storage admin permission
    default: op
