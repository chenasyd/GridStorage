# GridStorage main config

# Personal grid
grid:
  name: "网格仓库"
  # Max personal storage slots (each slot = 54 inventory cells)
  max-storage-count: 100
  page-size: 45
  gui-size: 54

language:
  default: "zh"
  allow-player-switch: false

logging:
  enabled: true
  # DEBUG, INFO, WARN, ERROR
  level: INFO
  file-logging: false
  log-file: "logs/gridstorage.log"
  max-file-size: 10
  max-files: 5
